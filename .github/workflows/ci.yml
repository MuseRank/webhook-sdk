name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # We pin bun (not Node) because `package.json#packageManager`
      # declares bun and the lockfile is `bun.lock`. Switching back
      # and forth between npm and bun caused install drift; this is
      # the single source of truth.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify package (typecheck + schema-drift + tests + build)
        run: bun run check

      - name: Verify npm package contents
        run: bun run pack:check
